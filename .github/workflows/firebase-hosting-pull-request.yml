name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTHDOMAIN: ${{ vars.VITE_FIREBASE_AUTHDOMAIN }}
      VITE_FIREBASE_PROJECTID: ${{ vars.VITE_FIREBASE_PROJECTID }}
      VITE_FIREBASE_STORAGEBUCKET: ${{ vars.VITE_FIREBASE_STORAGEBUCKET }}
      VITE_FIREBASE_MESSAGINGSENDERID: ${{ vars.VITE_FIREBASE_MESSAGINGSENDERID }}
      VITE_FIREBASE_APPID: ${{ vars.VITE_FIREBASE_APPID }}
      VITE_FIREBASE_MEASUREMENTID: ${{ vars.VITE_FIREBASE_MEASUREMENTID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GESTOR_FINANCEIRO_43435 }}
          projectId: gestor-financeiro-43435
