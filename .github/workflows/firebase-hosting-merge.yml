name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTHDOMAIN: ${{ vars.VITE_FIREBASE_AUTHDOMAIN }}
      VITE_FIREBASE_PROJECTID: ${{ vars.VITE_FIREBASE_PROJECTID }}
      VITE_FIREBASE_STORAGEBUCKET: ${{ vars.VITE_FIREBASE_STORAGEBUCKET }}
      VITE_FIREBASE_MESSAGINGSENDERID: ${{ vars.VITE_FIREBASE_MESSAGINGSENDERID }}
      VITE_FIREBASE_APPID: ${{ vars.VITE_FIREBASE_APPID }}
      VITE_FIREBASE_MEASUREMENTID: ${{ vars.VITE_FIREBASE_MEASUREMENTID }}
      VITE_USE_FIREBASE_EMULATORS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ github.ref_name == 'main' && secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GESTOR_FINANCEIRO_43435 }}
          channelId: live
          projectId: ${{ github.ref_name == 'main' && 'vesttor' || 'gestor-financeiro-43435' }}
